services:
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trade_db
      MYSQL_USER: trade
      MYSQL_PASSWORD: trade123
    ports:
      - "3306:3306"
    volumes:
      - trade_mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-trade-schema.sql
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=mysql_native_password"]

  redis:
    image: redis:7-alpine
    container_name: trade-redis
    ports:
      - "6379:6379"

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: trade-rmq-ns
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: trade-rmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 便于宿主机上的 Spring Boot 连接 Broker（Linux 可改为本机局域网 IP）
      JAVA_OPT_EXT: "-Xms512M -Xmx512M -Drocketmq.broker.ip1=host.docker.internal"
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true

  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: trade-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      STORE_MODE: file

  # 可选：Spring Cloud Alibaba Nacos（本仓库默认使用本地 application.yml，不依赖 Nacos 启动）
  # nacos:
  #   image: nacos/nacos-server:v2.3.2
  #   ports:
  #     - "8848:8848"
  #   environment:
  #     MODE: standalone

volumes:
  trade_mysql_data:
